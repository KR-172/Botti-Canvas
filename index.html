<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Canvas</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Caveat:wght@600&family=Roboto+Mono:wght@500&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <!-- The Drawing Layer -->
    <canvas id="drawing-canvas"></canvas>

    <!-- The Sticky Note Layer -->
    <div id="notes-container"></div>

    <!-- UI Overlay Layer -->
    <div class="toolbar glass-panel">
        <div class="tools-section">
            <button class="tool-btn active" id="tool-pen">✏️</button>
            <button class="tool-btn" id="tool-eraser">🧽</button>
            <button class="tool-btn" id="tool-pan">🖐️</button>
            
            <div class="color-picker">
                <input type="color" id="color-wheel" value="#ff3b30" class="color-wheel-input">
            </div>
        </div>
        
        <div class="actions-section">
            <input type="file" id="photo-upload" accept="image/*" style="display: none;">
            <button class="action-btn" id="photo-btn">📷 Photo</button>
            <button class="action-btn" id="add-note-btn">📝 Note</button>
        </div>
    </div>

    <!-- Modal for New Sticky Note -->
    <div id="note-modal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2>New Note</h2>
            <textarea id="note-text" rows="4" placeholder="Type something..."></textarea>
            
            <div class="note-options">
                <select id="note-font-select" class="glass-select">
                    <option value="font-inter">Modern (Inter)</option>
                    <option value="font-caveat">Handwriting (Caveat)</option>
                    <option value="font-roboto-mono">Typewriter (Roboto Mono)</option>
                    <option value="font-pacifico">Cursive (Pacifico)</option>
                </select>
            </div>
            
            <div class="note-colors">
                <button class="note-color-btn active" data-color="#ffeb3b" style="background: #ffeb3b;"></button>
                <button class="note-color-btn" data-color="#ff8a80" style="background: #ff8a80;"></button>
                <button class="note-color-btn" data-color="#80d8ff" style="background: #80d8ff;"></button>
                <button class="note-color-btn" data-color="#ccff90" style="background: #ccff90;"></button>
            </div>
            <button id="save-note-btn" class="primary-btn">Drop Note</button>
        </div>
    </div>

    <script src="app.js?v=5"></script>
</body>
</html>
